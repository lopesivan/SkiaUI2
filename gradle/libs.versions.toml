[versions]
# --- Android / Build ---
agp        = "9.4.0"
kotlin     = "2.4.20"
minSdk     = "29"
compileSdk = "37"
targetSdk  = "37"
ndk        = "29.0.14206865"
cmake      = "4.4.3"

# --- AndroidX ---
appcompat        = "1.8.0"
constraintlayout = "2.2.2"
media3           = "1.11.1"
webkit           = "1.17.1"

# --- Compose ---
composeBom = "2026.09.00"

# --- Terceiros ---
javaWebSocket = "1.6.0"
filament      = "1.77.1"
glide         = "4.16.0"

[libraries]
# AndroidX
androidx-appcompat        = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-webkit           = { module = "androidx.webkit:webkit", version.ref = "webkit" }

# Compose (versões gerenciadas pelo BOM)
androidx-compose-bom        = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-runtime    = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3  = { module = "androidx.compose.material3:material3" }

# Terceiros
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
glide            = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
java-websocket   = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebSocket" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
